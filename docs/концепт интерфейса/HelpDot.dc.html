<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<span onMouseEnter="{{ show }}" onMouseLeave="{{ hide }}" style="position:relative;display:inline-flex;vertical-align:middle">
  <button onClick="{{ toggle }}" onFocus="{{ show }}" onBlur="{{ hide }}" title="Справка" style="width:20px;height:20px;border-radius:50%;border:1px solid var(--border);background:{{ btnBg }};color:{{ btnFg }};cursor:pointer;font-size:11px;font-family:inherit;display:inline-flex;align-items:center;justify-content:center;line-height:1;padding:0">?</button>
  <sc-if value="{{ open }}" hint-placeholder-val="{{ false }}">
    <span style="position:absolute;top:26px;left:-8px;z-index:40;width:280px;background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:12px 14px;box-shadow:0 8px 28px rgba(0,0,0,.22);font-size:12.5px;line-height:1.5;color:var(--fg2);font-weight:400;font-family:system-ui,-apple-system,sans-serif;text-align:left">{{ text }}</span>
  </sc-if>
</span>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:300,&quot;height&quot;:200},&quot;text&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  state = { open: false };
  renderVals() {
    const o = this.state.open;
    return {
      open: o,
      text: this.props.text || '',
      btnBg: o ? 'var(--accent)' : 'var(--panel2)',
      btnFg: o ? 'var(--accent-fg)' : 'var(--fg3)',
      toggle: () => this.setState(s => ({ open: !s.open })),
      show: () => this.setState({ open: true }),
      hide: () => this.setState({ open: false }),
    };
  }
}
</script>
</body>
</html>
